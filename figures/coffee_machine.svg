<title id="t">The coffee-to-portfolio machine</title>
<desc id="d">A cup of coffee is poured into a machine with three windows - Prophet forecast, 4-qubit quantum kernel, 18-qubit QAOA - which prints an equal-weight four-ETF basket. The receipt notes the backtest Sharpe ratio: QAOA 0.70 versus equal weight 0.88.</desc>
